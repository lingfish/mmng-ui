[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mmng-ui"
dynamic = ["version"]
authors = [
    { name="Jason Lingohr", email="jason@lucid.net.au" },
]
description = "A Textual TUI for multimon-ng — decode POCSAG and FLEX pager messages from SDR applications in your terminal or web browser."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["pocsag", "flex", "pager", "multimon-ng", "sdr", "textual", "tui", "ham-radio", "decoder"]
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Utilities",
]
dependencies = [
    "click==8.3.0",
    "textual==6.3.0",
    "rich==14.2.0",
    "moment==0.12.1",
]

[project.optional-dependencies]
web = [
    "textual-serve==1.1.2",
]

[project.scripts]
mmng-ui = "mmng_ui.pocsag:main"

[project.urls]
Homepage = "https://github.com/lingfish/mmng-ui"
Issues = "https://github.com/lingfish/mmng-ui/issues"
Changelog = "https://github.com/lingfish/mmng-ui/blob/main/CHANGELOG.md"
CI = "https://gitlab.lucid.net.au/lucid/mmng-ui"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mmng_ui/_version.py"

[tool.hatch.build.targets.sdist]
only-packages = true

[tool.hatch.envs.dev]
extra-dependencies = [
    "textual-dev",
    "pytest",
    "coverage",
]

[tool.hatch.envs.hatch-test]
extra-dependencies = [
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source_pkgs = ["mmng_ui", "tests"]
branch = true
parallel = true

[tool.coverage.paths]
mmng_ui = ["src/mmng_ui", "*/mmng-ui/src/mmng_ui"]
tests = ["tests", "*/mmng-ui/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pylint]
max-line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
